<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير تحليل التطبيقات</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --text:#1c2430; --muted:#5d6b7c; --line:#dfe3e8;
  --accent:#1f5fae; --accent-soft:#e6eefa;
  --crit:#b42318; --high:#d9480f; --med:#a86b00; --low:#2f6fb3; --info:#6b7785;
  --ok:#1e7d4f; --ok-soft:#e5f4ec; --bad-soft:#fbeaea;
  --code-bg:#f3f4f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --panel:#181e26; --panel2:#1f2630; --text:#e4e8ee; --muted:#9aa6b4; --line:#2c3541;
    --accent:#6ea8ff; --accent-soft:#1d2b40;
    --crit:#ff6b5e; --high:#ff8a4c; --med:#e8b44a; --low:#6ea8ff; --info:#9aa6b4;
    --ok:#4cc98a; --ok-soft:#163226; --bad-soft:#3a1d1d; --code-bg:#0e1217;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --panel:#181e26; --panel2:#1f2630; --text:#e4e8ee; --muted:#9aa6b4; --line:#2c3541;
  --accent:#6ea8ff; --accent-soft:#1d2b40;
  --crit:#ff6b5e; --high:#ff8a4c; --med:#e8b44a; --low:#6ea8ff; --info:#9aa6b4;
  --ok:#4cc98a; --ok-soft:#163226; --bad-soft:#3a1d1d; --code-bg:#0e1217;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:15px;line-height:1.6}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header{padding:20px 16px 8px;max-width:1400px;margin:0 auto}
header h1{margin:0 0 4px;font-size:24px}
header .meta{color:var(--muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
header .meta code{direction:ltr;unicode-bidi:embed}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}
.theme{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
main{max-width:1400px;margin:0 auto;padding:16px}
section{display:none} section.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:18px}
.panel h3{margin:16px 0 8px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th.sort{cursor:pointer} th.sort:hover{color:var(--text)}
tr:hover td{background:var(--panel2)}
.num{font-variant-numeric:tabular-nums;text-align:center}
.tbl-wrap{overflow-x:auto}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.sev-critical{color:var(--crit)} .sev-high{color:var(--high)} .sev-medium{color:var(--med)} .sev-low{color:var(--low)} .sev-info{color:var(--info)}
.grade{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-weight:800;color:#fff}
.grade.big{width:56px;height:56px;font-size:28px;border-radius:14px}
.gA{background:#1e7d4f}.gB{background:#4f8a2a}.gC{background:#a86b00}.gD{background:#c4520c}.gF{background:#b42318}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px}
.scorecell{display:flex;align-items:center;gap:6px;min-width:90px}
.scorecell b{font-variant-numeric:tabular-nums;width:26px;text-align:center;font-weight:600}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.stack>i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--c)}
.apps-layout{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media (max-width:900px){.apps-layout{grid-template-columns:1fr}}
.applist{max-height:80vh;overflow:auto;padding:8px}
.applist input{width:100%}
.appitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer}
.appitem:hover{background:var(--panel2)} .appitem.active{background:var(--accent-soft)}
.appitem .n{flex:1;font-size:13px;word-break:break-all}
.appitem .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.apphead{display:flex;gap:16px;align-items:center}
.apphead h2{margin:0;word-break:break-all}
.summary{background:var(--panel2);border-radius:10px;padding:12px 14px;margin:12px 0}
.ai{border-inline-start:4px solid var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.metric{background:var(--panel2);border-radius:10px;padding:8px 10px}
.metric .v{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.metric .l{font-size:12px;color:var(--muted)}
.catbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.catbar .t{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.list{list-style:none;margin:0;padding:0}
.list li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline}
.list li:last-child{border-bottom:0}
.ok{color:var(--ok);font-weight:700} .bad{color:var(--crit);font-weight:700}
.task{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.task summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.task summary::-webkit-details-marker{display:none}
.task summary .tt{flex:1;font-weight:600;min-width:200px}
.task .body{padding:0 12px 12px}
.task .body p{margin:6px 0}
.pri{font-weight:800;font-size:12px;padding:1px 7px;border-radius:6px;color:#fff}
.P1{background:var(--crit)}.P2{background:var(--med)}.P3{background:var(--low)}
.muted{color:var(--muted)} .small{font-size:12px}
pre,code.c{direction:ltr;text-align:left;font-family:Consolas,"Cascadia Code",monospace;font-size:12.5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;white-space:pre}
code.c{background:var(--code-bg);padding:1px 5px;border-radius:5px;unicode-bidi:embed;word-break:break-all}
.loc{direction:ltr;unicode-bidi:embed;font-family:Consolas,monospace;font-size:12px;word-break:break-all}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
input[type=search]{min-width:220px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.delta-up{color:var(--ok)} .delta-down{color:var(--crit)}
.fw{display:inline-block;margin:2px 0 2px 6px}
.st-eol{color:var(--crit)} .st-near_eol{color:var(--high)} .st-legacy{color:var(--med)} .st-supported{color:var(--ok)} .st-library{color:var(--muted)}
.empty{color:var(--muted);padding:12px;text-align:center}
.rulecard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.rulecard h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media print{.toolbar{display:none} section{display:block!important} .applist{display:none}}
</style>
</head>

it() / GetResult())","category":"reliability","severity":"medium","why":"يسبب Deadlock واستنزاف الـ Thread Pool تحت الضغط، فيبطئ أو يوقف الـ API.","fix":"استخدم async/await على طول سلسلة الاستدعاء (async all the way).","example":"// بدلاً من: var res = client.GetAsync(url).Result;\nvar res = await client.GetAsync(url, cancellationToken);","fixable":false,"effort":"M"},"REL004":{"title":"إنشاء HttpClient جديد في كل استدعاء","category":"reliability","severity":"medium","why":"يؤدي إلى استنزاف المنافذ (Socket exhaustion) وأخطاء اتصال متقطعة تحت الضغط، ولا يحترم تغيّر DNS.","fix":"استخدم IHttpClientFactory (AddHttpClient) أو HttpClient واحد static.","example":"builder.Services.AddHttpClient<FawryClient>(c => c.BaseAddress = new Uri(cfg[\"Fawry:BaseUrl\"]!));\npublic class FawryClient(HttpClient http) { ... }","fixable":false,"effort":"M"},"REL005":{"title":"throw ex يفقد مسار الخطأ (Stack trace)","category":"reliability","severity":"low","why":"إعادة رمي الاستثناء بـ throw ex تمسح مكان حدوث الخطأ الأصلي فيصعب التشخيص.","fix":"استخدم throw; فقط (يمكن تطبيقها آليًا بأمر fix).","example":"","fixable":true,"effort":"S"},"REL006":{"title":"اتصال قاعدة بيانات بدون using","category":"reliability","severity":"medium","why":"إذا حدث استثناء قبل Close() يبقى الاتصال مفتوحًا فيمتلئ الـ Connection Pool وتتوقف الخدمة.","fix":"استخدم using var conn = new SqlConnection(...); ليُغلق الاتصال تلقائيًا.","example":"await using var conn = new SqlConnection(cs);\nawait conn.OpenAsync(ct);","fixable":false,"effort":"S"},"REL007":{"title":"استخدام Thread.Sleep","category":"reliability","severity":"low","why":"يحجز الـ Thread بالكامل؛ في الخدمات والـ API يقلل القدرة على تحمل الضغط ولا يمكن إلغاؤه.","fix":"استخدم await Task.Delay(time, cancellationToken) أو PeriodicTimer.","example":"","fixable":false,"effort":"S"},"REL008":{"title":"استدعاء GC.Collect يدويًا","category":"reliability","severity":"low","why":"إجبار جامع القمامة يسبب توقفات مفاجئة ويخفي مشاكل تسرب الذاكرة الحقيقية.","fix":"احذف ا ","example":"","fixable":false,"effort":"M"},"MOD004":{"title":"مكتبة JavaScript قديمة بها ثغرات (jQuery / Bootstrap)","category":"modernity","severity":"medium","why":"إصدارات jQuery < 3.5 وBootstrap القديمة بها ثغرات XSS معروفة.","fix":"حدّث المكتبة إلى أحدث إصدار متوافق وراجع الكود المعتمد عليها.","example":"","fixable":false,"effort":"M"},"HYG001":{"title":"لا توجد اختبارات آلية","category":"hygiene","severity":"medium","why":"بدون اختبارات أي تعديل أو ترقية قد يكسر وظائف حالية دون أن يلاحظ أحد.","fix":"أضف مشروع xUnit يغطي المنطق الحرج (الحسابات، التحقق، التكامل مع الجهات الخارجية عبر Mock).","example":"dotnet new xunit -n MyApp.Tests\ndotnet add MyApp.Tests reference MyApp\ndotnet test","fixable":false,"effort":"L"},"HYG002":{"title":"لا يوجد ملف README يشرح التطبيق","category":"hygiene","severity":"low","why":"المطور الجديد لا يعرف كيف يشغّل التطبيق أو ما هي إعداداته واعتمادياته.","fix":"أضف README يشرح: الغرض، طريقة التشغيل، الإعدادات المطلوبة، طريقة النشر، الجهات المتكاملة.","example":"","fixable":false,"effort":"S"},"HYG003":{"title":"ملف .gitignore مفقود أو ناقص","category":"hygiene","severity":"low","why":"تُرفع ملفات bin/obj وnode_modules والإعدادات الشخصية للمستودع فيكبر حجمه وتظهر تعارضات.","fix":"أضف .gitignore قياسي لـ .NET/Node (يمكن إنشاؤه آليًا بأمر fix).","example":"","fixable":true,"effort":"S"},"HYG004":{"title":"ملفات DLL/EXE داخل المستودع (خارج bin/obj)","category":"hygiene","severity":"medium","why":"الملفات الثنائية لا يمكن مراجعتها ولا معرفة مصدرها أو إصدارها، وقد تحتوي ثغرات.","fix":"استبدلها بحزم NuGet، أو ضعها في مخزن حزم داخلي.","example":"","fixable":false,"effort":"M"},"HYG005":{"title":"مخرجات البناء أو ملفات شخصية مرفوعة على git","category":"hygiene","severity":"medium","why":"رفع bin/obj/publish أو .user/.suo يضخم المستودع ويسبب تعارضات وقد يسرّب إعدادات.","fix":"احذفها من git (git rm -r --cached bin obj) وأضفها إلى .gitignore.","example":"","fixable":false,"effort":"S"},"HYG006":{"title":"تطبيق مكرر أو نسخة من تطبيق آخر","category":"hygiene","severity":"medium","why":"وجود نسخ متعددة من نفس التطبيق يجعل من غير الواضح أيها يعمل في الإنتاج ويضاعف جهد الصيانة.","fix":"حدد النسخة الرسمية، وانقل الفروقات إليها كـ branch، وأرشف النسخ الأخرى.","example":"","fixable":false,"effort":"M"},"HYG007":{"title":"اسم مجلد يدل على نسخة مؤقتة أو احتياطية","category":"hygiene","severity":"low","why":"أسماء مثل Copy / old / New folder / (1) تشير لنسخ غير منظمة.","fix":"أعد تسمية المجلد باسم واضح أو أرشفه.","example":"","fixable":false,"effort":"S"}},"labels":{"severity":{"critical":"حرج","high":"عالٍ","medium":"متوسط","low":"منخفض","info":"معلومة"},"category":{"security":"الأمان","reliability":"الاعتمادية والاستقرار","maintainability":"جودة الكود وقابلية الصيانة","modernity":"حداثة التقنيات والحزم","hygiene":"تنظيم المستودع والاختبارات"},"effort":{"S":"صغير (≤ نصف يوم)","M":"متوسط (1–3 أيام)","L":"كبير (أسبوع أو أكثر)"}}};
const L = D.labels, CATS = ["security","reliability","maintainability","modernity","hygiene"];
const SEVS = ["critical","high","medium","low","info"];
const SEVVAR = {critical:"--crit",high:"--high",medium:"--med",low:"--low",info:"--info"};
const STATUS_AR = {eol:"منتهي الدعم",near_eol:"قريب من نهاية الدعم",legacy:"قديم",supported:"مدعوم",library:"مكتبة"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("en-US");
const sevChip = s => `<span class="chip sev-${s}">${L.severity[s]}</span>`;
const gradeBox = (g, big) => `<span class="grade g${g}${big?" big":""}">${g}</span>`;
const scoreColor = v => v>=85?"#1e7d4f":v>=70?"#4f8a2a":v>=55?"#a86b00":v>=40?"#c4520c":"#b42318";
const scoreCell = v => `<div class="scorecell"><b>${v}</b><div class="bar" style="flex:1"><i style="width:${v}%;background:${scoreColor(v)}"></i></div></div>`;
const pri = p => `<span class="pri ${p}">${p}</span>`;
function vscode(file, line){
  if(!file) return "";
  const abs = (D.meta.root + "\\" + file).replace(/\\/g,"/");
  return `vscode://file/${encodeURI(abs)}:${line||1}`;
}
const locLink = (file, line) => file ? `<a class="loc" href="${vscode(file,line)}" title="فتح في VS Code">${esc(file)}${line?":"+line:""}</a>` : `<span class="muted small">مستوى التطبيق</span>`;
const appByName = Object.fromEntries(D.apps.map(a => [a.name, a]));

/* ---------------- theme */
(function(){
  const root = document.documentElement;
  let t = null; try{ t = localStorage.getItem("caa-theme"); }catch(e){}
  if(t) root.dataset.theme = t;
  $("#theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try{ localStorage.setItem("caa-theme", root.dataset.theme); }catch(e){}
  };
})();

/* ---------------- meta */
(function(){
  const m = D.meta;
  const sk = Object.entries(m.skipped||{}).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v}`).join("، ");
  $("#meta").innerHTML = `<span>المسار: <code>${esc(m.root)}</code></span><span>التاريخ: ${esc(m.date.replace("T"," "))}</span>
    <span>مدة الفحص: ${m.duration} ث</span>${m.previous?`<span>الفحص السابق: ${esc(m.previous.date.replace("T"," "))} (متوسط ${m.previous.avg})</span>`:""}
    ${sk?`<span title="ملفات لم تُقرأ">ملفات متخطاة: ${esc(sk)}</span>`:""}`;
})();

/* ---------------- tabs */
function showTab(name){
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab===name));
  document.querySelectorAll("main>section").forEach(s => s.classList.toggle("active", s.id==="tab-"+name));
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
window.addEventListener("hashchange", route);
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("app=")){ showTab("apps"); renderApp(h.slice(4)); return; }
  showTab(["overview","apps","tasks","findings","rules"].includes(h) ? h : "overview");
  if(h==="apps") renderApp(currentApp);
}

/* ---------------- overview */
function renderOverview(){
  const m = D.meta;
  const total = SEVS.reduce((s,k)=>s+(m.severity[k]||0),0) || 1;
  const kpi = (v,l) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  let h = `<div class="kpis">
    ${kpi(`${gradeBox(m.avg_grade)} ${m.avg_score}`, "متوسط التقييم")}
    ${kpi(fmt(m.apps), "تطبيق")}${kpi(fmt(m.code_files), "ملف كود")}${kpi(fmt(m.loc), "سطر كود")}
    ${kpi(fmt(m.findings), "نتيجة")}
    ${kpi(`<span class="sev-critical">${fmt(m.severity.critical)}</span>`, "حرجة")}
    ${kpi(`<span class="sev-high">${fmt(m.severity.high)}</span>`, "عالية")}
  </div>`;
  h += `<div class="grid2"><div class="panel"><h2>توزيع النتائج حسب الخطورة</h2>
    <div class="stack">${SEVS.map(s=>`<i style="width:${100*(m.severity[s]||0)/total}%;background:var(${SEVVAR[s]})" title="${L.severity[s]}: ${m.severity[s]}"></i>`).join("")}</div>
    <div class="legend">${SEVS.map(s=>`<span style="--c:var(${SEVVAR[s]})">${L.severity[s]} ${fmt(m.severity[s])}</span>`).join("")}</div>
    <h3>حسب المحور</h3><table>${CATS.map(c=>`<tr><td>${L.category[c]}</td><td class="num">${fmt(m.category[c])}</td>
      <td style="width:50%"><div class="bar"><i style="width:${100*(m.category[c]||0)/Math.max(1,...CATS.map(x=>m.category[x]))}%;background:var(--accent)"></i></div></td></tr>`).join("")}</table>
  </div><div class="panel"><h2>متوسط التقييم لكل محور</h2>
    <div class="catbars" style="grid-template-columns:1fr">${CATS.map(c=>{const v=Math.round(D.apps.reduce((s,a)=>s+a.scores[c],0)/Math.max(1,D.apps.length));
      return `<div class="catbar"><div class="t"><span>${L.category[c]}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%;background:${scoreColor(v)}"></i></div></div>`}).join("")}</div>
    <h3>أضعف التطبيقات</h3><ul class="list">${[...D.apps].sort((a,b)=>a.overall-b.overall).slice(0,5).map(a=>
      `<li>${gradeBox(a.grade)} <a href="#app=${encodeURIComponent(a.name)}">${esc(a.name)}</a> <span class="muted small">${a.overall}/100 — حرج ${a.severity_counts.critical}، عالٍ ${a.severity_counts.high}</span></li>`).join("")}</ul>
  </div></div>`;
  h += `<div class="panel"><h2>ترتيب التطبيقات</h2><div class="tbl-wrap"><table id="appsTable"><thead><tr>
    <th class="sort" data-k="name">التطبيق</th><th class="sort" data-k="overall">التقييم</th>
    ${CATS.map(c=>`<th class="sort" data-k="s:${c}">${L.category[c]}</th>`).join("")}
    <th class="sort num" data-k="c:critical">حرج</th><th class="sort num" data-k="c:high">عالٍ</th><th class="sort num" data-k="loc">الأسطر</th><th class="sort num" data-k="delta">التغيّر</th><th>الإطار</th>
  </tr></thead><tbody></tbody></table></div></div>`;
  if(D.portfolio_tasks.length){
    h += `<div class="panel"><h2>مبادرات مشتركة (تتكرر في 3 تطبيقات أو أكثر)</h2>${D.portfolio_tasks.map(p=>`
      <details class="task"><summary>${pri(p.priority)} ${sevChip(p.severity)} <span class="tt">${esc(p.title)}</span>
      <span class="muted small">${p.apps.length} تطبيق · ${fmt(p.count)} نتيجة · ${esc(p.category_ar)}</span></summary>
      <div class="body"><p><b>لماذا:</b> ${esc(p.why)}</p><p><b>الحل:</b> ${esc(p.how)}</p>
      <p class="small">${p.apps.map(a=>`<a href="#app=${encodeURIComponent(a)}">${esc(a)}</a>`).join(" · ")}</p></div></details>`).join("")}</div>`;
  }
  if(D.duplicate_pairs.length){
    h += `<div class="panel"><h2>تطبيقات مكررة أو منسوخة من بعضها</h2><table><thead><tr><th>التطبيق</th><th>التطبيق</th><th class="num">ملفات متطابقة</th><th class="num">نسبة التطابق</th></tr></thead><tbody>
    ${D.duplicate_pairs.sort((a,b)=>b.pct-a.pct).map(p=>`<tr><td><a href="#app=${encodeURIComponent(p.a)}">${esc(p.a)}</a></td><td><a href="#app=${encodeURIComponent(p.b)}">${esc(p.b)}</a></td><td class="num">${p.shared}</td><td class="num">${p.pct}%</td></tr>`).join("")}</tbody></table></div>`;
  }
  $("#tab-overview").innerHTML = h;
  let sortK = "overall", sortDir = 1;
  const val = (a,k) => k==="name"?a.name.toLowerCase():k==="overall"?a.overall:k==="loc"?(a.metrics.loc||0):k==="delta"?(a.delta??0):
    k.startsWith("s:")?a.scores[k.slice(2)]:a.severity_counts[k.slice(2)];
  function fill(){
    const rows = [...D.apps].sort((a,b)=>{const x=val(a,sortK),y=val(b,sortK);return (x>y?1:x<y?-1:0)*sortDir;});
    $("#appsTable tbody").innerHTML = rows.map(a=>`<tr>
      <td><a href="#app=${encodeURIComponent(a.name)}">${esc(a.name)}</a></td>
      <td>${gradeBox(a.grade)} <b>${a.overall}</b></td>
      ${CATS.map(c=>`<td>${scoreCell(a.scores[c])}</td>`).join("")}
      <td class="num sev-critical">${a.severity_counts.critical||""}</td><td class="num sev-high">${a.severity_counts.high||""}</td>
      <td class="num">${fmt(a.metrics.loc)}</td>
      <td class="num">${a.delta===undefined?"—":a.delta>0?`<span class="delta-up">▲${a.delta}</span>`:a.delta<0?`<span class="delta-down">▼${-a.delta}</span>`:"="}</td>
      <td class="small">${a.frameworks.map(f=>`<span class="fw st-${f.status}" title="${STATUS_AR[f.status]}">${esc(f.label)}</span>`).join("")||"—"}</td></tr>`).join("");
  }
  document.querySelectorAll("#appsTable th.sort").forEach(th => th.onclick = () => {
    const k = th.dataset.k; if(sortK===k) sortDir=-sortDir; else {sortK=k; sortDir = k==="name"?1:(k.startsWith("c:")||k==="loc")?-1:1;} fill();
  });
  fill();
}

/* ---------------- apps */
let currentApp = null;
function renderAppsShell(){
  $("#tab-apps").innerHTML = `<div class="apps-layout"><div class="panel applist"><input type="search" id="appSearch" placeholder="بحث عن تطبيق..."><div id="appItems"></div></div><div id="appDetail"></div></div>`;
  const fillList = () => {
    const q = ($("#appSearch").value||"").toLowerCase();
    $("#appItems").innerHTML = [...D.apps].sort((a,b)=>a.overall-b.overall).filter(a=>a.name.toLowerCase().includes(q)).map(a=>
      `<div class="appitem${a.name===currentApp?" active":""}" data-n="${esc(a.name)}">${gradeBox(a.grade)}<span class="n">${esc(a.name)}</span><span class="s">${a.overall}</span></div>`).join("");
    document.querySelectorAll(".appitem").forEach(x => x.onclick = () => { location.hash = "app=" + encodeURIComponent(x.dataset.n); });
  };
  $("#appSearch").oninput = fillList; fillList();
  renderAppsShell.fill = fillList;
}
function taskCard(t){
  return `<details class="task"><summary>${pri(t.priority)} ${sevChip(t.severity)} <span class="tt">${esc(t.title)}</span>
    <span class="muted small">${t.id} · ${t.count} نتيجة · ${t.files} ملف · الجهد: ${esc(L.effort[t.effort])}${t.fixable?" · 🔧 إصلاح آلي متاح":""}</span></summary>
    <div class="body"><p><b>لماذا هذا مهم:</b> ${esc(t.why)}</p><p><b>طريقة الإصلاح:</b> ${esc(t.how)}</p>
    ${t.example?`<pre>${esc(t.example)}</pre>`:""}
    ${t.fixable?`<p class="small">للإصلاح الآلي: <code class="c">run.bat fix "${esc(D.meta.root)}" --rules ${t.rule} --app "${esc(t.app)}"</code> (معاينة) ثم أضف <code class="c">--apply</code></p>`:""}
    <p><b>المواقع:</b></p><ul class="list">${t.locations.map(l=>{const m=l.loc.match(/^(.*?)(?::(\d+))?$/);return `<li>${l.loc==="(مستوى التطبيق)"?'<span class="muted small">مستوى التطبيق</span>':locLink(m[1],m[2])} <span class="small">${esc(l.msg)}</span></li>`}).join("")}</ul>
    <p class="small muted"><b>معيار القبول:</b> ${esc(t.acceptance)}</p></div></details>`;
}
function renderApp(name){
  const a = appByName[name] || [...D.apps].sort((x,y)=>x.overall-y.overall)[0];
  if(!a){ $("#appDetail").innerHTML = `<div class="empty">لا توجد تطبيقات</div>`; return; }
  currentApp = a.name; renderAppsShell.fill && renderAppsShell.fill();
  const m = a.metrics;
  const met = (v,l) => `<div class="metric"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  let h = `<div class="panel"><div class="apphead">${gradeBox(a.grade,true)}<div><h2>${esc(a.name)}</h2>
    <div class="muted small loc">${esc(a.path)}</div><div class="small">التقييم العام <b>${a.overall}/100</b>${a.delta!==undefined?` · التغيّر عن الفحص السابق: ${a.delta>0?`<span class="delta-up">▲${a.delta}</span>`:a.delta<0?`<span class="delta-down">▼${-a.delta}</span>`:"بدون تغيير"}`:""}</div></div></div>
    <div class="summary">${esc(a.summary)}</div>
    ${a.ai_summary?`<div class="summary ai"><b>تحليل النموذج المحلي (AI):</b><br>${esc(a.ai_summary).replace(/\n/g,"<br>")}</div>`:""}
    <div class="catbars">${CATS.map(c=>`<div class="catbar"><div class="t"><span>${L.category[c]}</span><b>${a.scores[c]}</b></div><div class="bar"><i style="width:${a.scores[c]}%;background:${scoreColor(a.scores[c])}"></i></div></div>`).join("")}</div>
    <div class="metrics">${met(fmt(m.code_files),"ملف كود")}${met(fmt(m.loc),"سطر كود")}${met(fmt(m.methods),"دالة")}${met(m.avg_method||0,"متوسط طول الدالة")}
      ${met(m.max_method||0,"أطول دالة")}${met(fmt(m.endpoints),"Endpoint")}${met(fmt(m.test_cases),"اختبار آلي")}${met((m.dup_pct||0)+"%","نسبة التكرار")}${met(fmt(m.packages),"حزمة")}</div>
    <div class="small"><b>الإطارات:</b> ${a.frameworks.map(f=>`<span class="fw st-${f.status}">${esc(f.label)} (${STATUS_AR[f.status]}${f.eol?" · "+f.eol:""})</span>`).join(" ")||"—"}</div>
  </div>`;
  h += `<div class="grid2"><div class="panel"><h2>✅ نقاط القوة</h2>${a.strengths.length?`<ul class="list">${a.strengths.map(s=>`<li><span class="ok">✔</span><span>${esc(s.title)} <span class="muted small">${esc(s.evidence)}</span></span></li>`).join("")}</ul>`:`<div class="empty">لم تُرصد ممارسات قوة واضحة</div>`}</div>
    <div class="panel"><h2>❌ نقاط الضعف</h2>${a.weaknesses.length?`<ul class="list">${a.weaknesses.map(w=>`<li><span class="bad">✖</span>${sevChip(w.severity)}<span>${esc(w.title)} <span class="muted small">×${w.count}</span></span></li>`).join("")}</ul>`:`<div class="empty">لا توجد نقاط ضعف مرصودة 🎉</div>`}</div></div>`;
  h += `<div class="panel"><h2>مهام التحسين المقترحة (${a.tasks.length})</h2>${a.tasks.map(taskCard).join("")||`<div class="empty">لا توجد مهام</div>`}</div>`;
  if(a.projects.length) h += `<div class="panel"><h2>المشاريع</h2><div class="tbl-wrap"><table><thead><tr><th>الملف</th><th>الإطار</th><th>النوع</th><th class="num">حزم</th></tr></thead><tbody>
    ${a.projects.map(p=>`<tr><td>${locLink(p.file,0)}</td><td class="loc">${esc(p.tfms.join(", "))}</td><td>${esc(p.type)}</td><td class="num">${p.packages}</td></tr>`).join("")}</tbody></table></div></div>`;
  h += `<div class="panel"><h2>النتائج التفصيلية (${a.findings.length})</h2><div id="appFindings"></div></div>`;
  $("#appDetail").innerHTML = h;
  findingsTable($("#appFindings"), a.findings.map(f=>({...f, app:a.name})), false);
}

/* ---------------- findings table (shared) */
function findingsTable(host, rows, showApp){
  const PAGE = 100; let page = 0;
  const draw = () => {
    const slice = rows.slice(page*PAGE, (page+1)*PAGE);
    host.innerHTML = rows.length ? `<div class="tbl-wrap"><table><thead><tr>${showApp?"<th>التطبيق</th>":""}<th>الخطورة</th><th>القاعدة</th><th>الموقع</th><th>التفاصيل</th></tr></thead><tbody>
      ${slice.map(f=>`<tr>${showApp?`<td class="small"><a href="#app=${encodeURIComponent(f.app)}">${esc(f.app)}</a></td>`:""}<td>${sevChip(f.severity)}</td>
        <td class="small" title="${esc(D.rules[f.rule].why)}"><b>${f.rule}</b><br>${esc(D.rules[f.rule].title)}</td>
        <td>${locLink(f.file,f.line)}</td>
        <td>${f.message?`<div class="small">${esc(f.message)}</div>`:""}${f.snippet?`<code class="c">${esc(f.snippet)}</code>`:""}</td></tr>`).join("")}
      </tbody></table></div>${rows.length>PAGE?`<div class="pager"><button class="btn" data-p="-1" ${page===0?"disabled":""}>السابق</button><span class="small">${page+1} / ${Math.ceil(rows.length/PAGE)} (${fmt(rows.length)} نتيجة)</span><button class="btn" data-p="1" ${(page+1)*PAGE>=rows.length?"disabled":""}>التالي</button></div>`:""}`
      : `<div class="empty">لا توجد نتائج</div>`;
    host.querySelectorAll(".pager .btn").forEach(b => b.onclick = () => { page += +b.dataset.p; draw(); host.scrollIntoView({block:"start"}); });
  };
  draw();
}

/* ---------------- all findings */
function renderFindings(){
  const all = D.apps.flatMap(a => a.findings.map(f => ({...f, app:a.name})));
  const rules = [...new Set(all.map(f=>f.rule))].sort();
  $("#tab-findings").innerHTML = `<div class="panel"><h2>كل النتائج</h2><div class="filters">
    <select id="fApp"><option value="">كل التطبيقات</option>${D.apps.map(a=>`<option>${esc(a.name)}</option>`).join("")}</select>
    <select id="fSev"><option value="">كل درجات الخطورة</option>${SEVS.map(s=>`<option value="${s}">${L.severity[s]}</option>`).join("")}</select>
    <select id="fCat"><option value="">كل المحاور</option>${CATS.map(c=>`<option value="${c}">${L.category[c]}</option>`).join("")}</select>
    <select id="fRule"><option value="">كل القواعد</option>${rules.map(r=>`<option value="${r}">${r} — ${esc(D.rules[r].title)}</option>`).join("")}</select>
    <input type="search" id="fQ" placeholder="بحث في الملف أو الرسالة..."></div><div id="fHost"></div></div>`;
  const apply = () => {
    const app=$("#fApp").value, sev=$("#fSev").value, cat=$("#fCat").value, rule=$("#fRule").value, q=$("#fQ").value.toLowerCase();
    findingsTable($("#fHost"), all.filter(f => (!app||f.app===app)&&(!sev||f.severity===sev)&&(!cat||f.category===cat)&&(!rule||f.rule===rule)&&
      (!q||(f.file+" "+f.message+" "+f.snippet).toLowerCase().includes(q))), true);
  };
  ["#fApp","#fSev","#fCat","#fRule"].forEach(s => $(s).onchange = apply); $("#fQ").oninput = apply; apply();
}

/* ---------------- tasks */
function renderTasks(){
  const all = D.apps.flatMap(a => a.tasks);
  $("#tab-tasks").innerHTML = `<div class="panel"><h2>مهام التحسين (${all.length})</h2>
    <p class="muted small">المهام مرتبة حسب الأولوية: P1 = فوري (ثغرات حرجة/أمان)، P2 = خلال السبرنت القادم، P3 = تحسينات. ملف tasks.csv بجانب التقرير يفتح في Excel.</p>
    <div class="filters"><select id="tApp"><option value="">كل التطبيقات</option>${D.apps.map(a=>`<option>${esc(a.name)}</option>`).join("")}</select>
    <select id="tPri"><option value="">كل الأولويات</option><option>P1</option><option>P2</option><option>P3</option></select>
    <select id="tCat"><option value="">كل المحاور</option>${CATS.map(c=>`<option value="${c}">${L.category[c]}</option>`).join("")}</select>
    <select id="tFix"><option value="">الكل</option><option value="1">قابل للإصلاح الآلي فقط</option></select>
    <input type="search" id="tQ" placeholder="بحث..."></div><div id="tHost"></div></div>`;
  const apply = () => {
    const app=$("#tApp").value, p=$("#tPri").value, c=$("#tCat").value, fx=$("#tFix").value, q=$("#tQ").value.toLowerCase();
    const rows = all.filter(t => (!app||t.app===app)&&(!p||t.priority===p)&&(!c||t.category===c)&&(!fx||t.fixable)&&(!q||(t.title+" "+t.app).toLowerCase().includes(q)))
      .sort((a,b)=> a.priority.localeCompare(b.priority) || SEVS.indexOf(a.severity)-SEVS.indexOf(b.severity) || b.weight-a.weight);
    const shown = rows.slice(0, 300);
    $("#tHost").innerHTML = shown.map(t => taskCard(t).replace('<span class="tt">', `<span class="tt"><a href="#app=${encodeURIComponent(t.app)}" class="small">${esc(t.app)}</a> — `)).join("")
      + (rows.length>300?`<div class="empty">يُعرض أول 300 مهمة من ${rows.length} — استخدم الفلاتر</div>`:"") || `<div class="empty">لا توجد مهام</div>`;
  };
  ["#tApp","#tPri","#tCat","#tFix"].forEach(s => $(s).onchange = apply); $("#tQ").oninput = apply; apply();
}

/* ---------------- rules */
function renderRules(){
  const used = {}; D.apps.forEach(a => a.findings.forEach(f => used[f.rule] = (used[f.rule]||0)+1));
  $("#tab-rules").innerHTML = `<div class="panel"><h2>دليل القواعد (${Object.keys(D.rules).length})</h2>
    <p class="muted small">كل قاعدة تشرح سبب الخطورة وطريقة الإصلاح. القواعد تعمل بالكامل بدون إنترنت.</p>
    ${CATS.map(c=>`<h3>${L.category[c]}</h3>`+Object.entries(D.rules).filter(([k,r])=>r.category===c).map(([k,r])=>`
      <div class="rulecard"><h4><code class="c">${k}</code> ${sevChip(r.severity)} ${esc(r.title)} <span class="muted small">${used[k]?fmt(used[k])+" نتيجة":"لا نتائج"}${r.fixable?" · 🔧 إصلاح آلي":""}</span></h4>
      <div class="small"><b>لماذا:</b> ${esc(r.why)}</div><div class="small"><b>الحل:</b> ${esc(r.fix)}</div>${r.example?`<pre>${esc(r.example)}</pre>`:""}</div>`).join("")).join("")}</div>`;
}

renderOverview(); renderAppsShell(); renderTasks(); renderFindings(); renderRules();
route();
</script>
</body>
</html>
